[providers.dry_run]
enabled = true

[providers.volcengine_seed_tts]
enabled = true
api_key_env = "VOLCENGINE_TTS_API_KEY"
resource_id_env = "VOLCENGINE_TTS_RESOURCE_ID"
endpoint_env = "VOLCENGINE_TTS_ENDPOINT"
audio_format_env = "VOLCENGINE_TTS_AUDIO_FORMAT"
sample_rate_env = "VOLCENGINE_TTS_SAMPLE_RATE"
bit_rate_env = "VOLCENGINE_TTS_BIT_RATE"
speech_rate_env = "VOLCENGINE_TTS_SPEECH_RATE"
loudness_rate_env = "VOLCENGINE_TTS_LOUDNESS_RATE"
emotion_env = "VOLCENGINE_TTS_EMOTION"
emotion_scale_env = "VOLCENGINE_TTS_EMOTION_SCALE"
enable_subtitle_env = "VOLCENGINE_TTS_ENABLE_SUBTITLE"
user_id_env = "VOLCENGINE_TTS_USER_ID"
timeout_seconds_env = "VOLCENGINE_TTS_TIMEOUT_SECONDS"

[providers.volcengine_seed_tts.speaker1]
speaker_env = "VOLCENGINE_TTS_SPEAKER1_SPEAKER"
speech_rate_env = "VOLCENGINE_TTS_SPEAKER1_SPEECH_RATE"
loudness_rate_env = "VOLCENGINE_TTS_SPEAKER1_LOUDNESS_RATE"
emotion_env = "VOLCENGINE_TTS_SPEAKER1_EMOTION"
emotion_scale_env = "VOLCENGINE_TTS_SPEAKER1_EMOTION_SCALE"

[providers.volcengine_seed_tts.speaker2]
speaker_env = "VOLCENGINE_TTS_SPEAKER2_SPEAKER"
speech_rate_env = "VOLCENGINE_TTS_SPEAKER2_SPEECH_RATE"
loudness_rate_env = "VOLCENGINE_TTS_SPEAKER2_LOUDNESS_RATE"
emotion_env = "VOLCENGINE_TTS_SPEAKER2_EMOTION"
emotion_scale_env = "VOLCENGINE_TTS_SPEAKER2_EMOTION_SCALE"

[providers.dashscope_cosyvoice]
enabled = false
api_key_env = "DASHSCOPE_API_KEY"
speaker1_voice_env = "DASHSCOPE_SPEAKER1_VOICE"
speaker2_voice_env = "DASHSCOPE_SPEAKER2_VOICE"

[providers.minimax_speech]
enabled = false
api_key_env = "MINIMAX_API_KEY"
group_id_env = "MINIMAX_GROUP_ID"
speaker1_voice_env = "MINIMAX_SPEAKER1_VOICE"
speaker2_voice_env = "MINIMAX_SPEAKER2_VOICE"

[providers.tencent_tts]
enabled = true
secret_id_env = "TENCENTCLOUD_SECRET_ID"
secret_key_env = "TENCENTCLOUD_SECRET_KEY"
region_env = "TENCENTCLOUD_REGION"
endpoint_env = "TENCENT_TTS_ENDPOINT"
codec_env = "TENCENT_TTS_CODEC"
sample_rate_env = "TENCENT_TTS_SAMPLE_RATE"
speed_env = "TENCENT_TTS_SPEED"
volume_env = "TENCENT_TTS_VOLUME"
primary_language_env = "TENCENT_TTS_PRIMARY_LANGUAGE"
model_type_env = "TENCENT_TTS_MODEL_TYPE"
enable_subtitle_env = "TENCENT_TTS_ENABLE_SUBTITLE"
timeout_seconds_env = "TENCENT_TTS_TIMEOUT_SECONDS"
fast_voice_type_env = "TENCENT_TTS_FAST_VOICE_TYPE"
emotion_category_env = "TENCENT_TTS_EMOTION_CATEGORY"
emotion_intensity_env = "TENCENT_TTS_EMOTION_INTENSITY"

[providers.tencent_tts.speaker1]
voice_type_env = "TENCENT_TTS_SPEAKER1_VOICE_TYPE"
speed_env = "TENCENT_TTS_SPEAKER1_SPEED"
volume_env = "TENCENT_TTS_SPEAKER1_VOLUME"
fast_voice_type_env = "TENCENT_TTS_SPEAKER1_FAST_VOICE_TYPE"
emotion_category_env = "TENCENT_TTS_SPEAKER1_EMOTION_CATEGORY"
emotion_intensity_env = "TENCENT_TTS_SPEAKER1_EMOTION_INTENSITY"

[providers.tencent_tts.speaker2]
voice_type_env = "TENCENT_TTS_SPEAKER2_VOICE_TYPE"
speed_env = "TENCENT_TTS_SPEAKER2_SPEED"
volume_env = "TENCENT_TTS_SPEAKER2_VOLUME"
fast_voice_type_env = "TENCENT_TTS_SPEAKER2_FAST_VOICE_TYPE"
emotion_category_env = "TENCENT_TTS_SPEAKER2_EMOTION_CATEGORY"
emotion_intensity_env = "TENCENT_TTS_SPEAKER2_EMOTION_INTENSITY"
